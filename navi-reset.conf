#!/bin/bash
# Navicat Premium reset - configuration
# 部署到 GitHub 后，其他人只需修改这里的路径即可适配自己的机器。
# 也可以通过环境变量覆盖：NAVICAT_APP_PATH / NAVICAT_SERVICE / NAVICAT_PREFERENCES / NAVICAT_DATA_DIR / NAVICAT_KEYCHAIN / NAVICAT_KEYCHAIN_SERVICE

NAVICAT_APP_PATH="${NAVICAT_APP_PATH:-/Applications/Navicat Premium.app}"
NAVICAT_SERVICE="${NAVICAT_SERVICE:-com.navicat.NavicatPremium}"
NAVICAT_PREFERENCES="${NAVICAT_PREFERENCES:-${HOME}/Library/Preferences/${NAVICAT_SERVICE}.plist}"
NAVICAT_DATA_DIR="${NAVICAT_DATA_DIR:-${HOME}/Library/Application Support/PremiumSoft CyberTech/Navicat CC/Navicat Premium}"
NAVICAT_KEYCHAIN="${NAVICAT_KEYCHAIN:-${HOME}/Library/Keychains/login.keychain-db}"
NAVICAT_KEYCHAIN_SERVICE="${NAVICAT_KEYCHAIN_SERVICE:-$NAVICAT_SERVICE}"
